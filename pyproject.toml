[project]
name = "comfyui-multigpu"
description = "Provides a suite of custom nodes to manage multiple GPUs for ComfyUI, including advanced model offloading for both GGUF and Safetensor formats with DisTorch, and bespoke MultiGPU support for WanVideoWrapper and other custom nodes."
version = "2.6.4"
license = {file = "LICENSE"}

[project.urls]
Repository = "https://github.com/delfianto/ComfyUI-MultiGPU"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "pollockjj"
DisplayName = "ComfyUI-MultiGPU"
Icon = "https://raw.githubusercontent.com/delfianto/ComfyUI-MultiGPU/main/docs/assets/multigpu_icon.png"

[dependency-groups]
dev = ["ruff>=0.17,<0.18", "basedpyright>=1.39,<2", "packaging>=24"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["**/generated/*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# ComfyUI loads optional providers after module initialization. Lambdas form
# part of the patch interface; explicit equality supports tensor-like objects.
ignore = ["E402", "E731", "E712", "B007", "B009", "B010"]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["."]
exclude = [".venv", "**/__pycache__"]
# ComfyUI and optional custom nodes are supplied by the host application.
reportMissingImports = false
reportMissingModuleSource = false

stubPath = "typings"
# ComfyUI accepts any name for its classmethod receiver.
reportSelfClsParameterName = false

# Match editor diagnostics in CLI/CI so tagged hints cannot silently accumulate.
reportUnusedVariable = "warning"
reportUnusedParameter = "warning"
reportDeprecated = "warning"
