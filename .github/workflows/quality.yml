name: Python quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools and CPU test dependencies
        run: |
          python -m pip install 'ruff>=0.17,<0.18' 'basedpyright>=1.39,<2' packaging
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: ruff format --check .
      - run: basedpyright -p pyproject.toml --warnings
      - run: python -m unittest discover -s tests -v
