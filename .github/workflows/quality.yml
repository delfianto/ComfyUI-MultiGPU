name: Python quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development tools and CPU test dependencies
        run: |
          python -m pip install 'ruff>=0.17,<0.18' 'basedpyright>=1.39,<2' numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      - run: ruff format --check .
      - run: basedpyright -p pyproject.toml --warnings
      - run: python -m unittest discover -s tests -v
  stable-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch latest stable ComfyUI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/Comfy-Org/ComfyUI/releases/latest --jq '.tag_name')
          git clone --depth 1 --branch "$tag" https://github.com/Comfy-Org/ComfyUI.git "$RUNNER_TEMP/ComfyUI"
          printf 'Auditing ComfyUI %s\n' "$tag"
      - name: Install stable core and CPU runtime dependencies
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r "$RUNNER_TEMP/ComfyUI/requirements.txt" -r "$RUNNER_TEMP/ComfyUI/manager_requirements.txt"
      - name: Validate real core APIs and node registration
        run: python ci/check_core_api.py "$RUNNER_TEMP/ComfyUI"
